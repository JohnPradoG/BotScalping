# Estrategia 2 (hipótesis): ruptura en M15, stop 2·ATR(M15), ventana de apertura NY.
# Motivo: con stop 1·ATR M1 el coste era 0.6–0.9 R (ver docs/registro.md).
# Cada [[filters]] es un componente; el ORDEN es el de la escalera
# (modo ladder). Para desactivar uno, coméntalo. Parámetros no indicados = valores por defecto
# del componente (ver botscalping/components.py).
name = "xauusd_m15_v2"

[data]
symbol = "XAUUSD"
path = "data/XAUUSD_M1.csv.gz"
point = 0.001                    # Exness XAUUSDm
broker_tz = "UTC"                # servidor Exness = UTC (verificado al exportar)
session_tz = "America/New_York"
session_open = "09:30"

[split]
in_sample_until = "2025-06-30"   # todo lo posterior es out-of-sample

[strategy]
setup = "breakout"
setup_params = { lookback = 5, sl_atr = 2.0, tf = "15min" }
rr = 2.0
max_bars = 390                  # en barras M1

# Condición fija de la hipótesis (no se evalúa): solo entradas en las 2 h tras la apertura de NY.
[[strategy.base_filters]]
component = "session_hours"
params = { start = 0, end = 120 }

[costs]
commission = 0.0                 # en precio por operación completa
slippage_points = 50              # = 0.05 en precio (point 0.001)

[analysis]
min_trades = 100
benchmark_random = true

[[filters]]
component = "trend_m5"
params = { ema = 20 }

[[filters]]
component = "vwap"

[[filters]]
component = "rejection_candle"

[[filters]]
component = "volume"

[[filters]]
component = "ema_9_20"

[[filters]]
component = "opening_range"
params = { minutes = 15 }

[[filters]]
component = "structure_break"

[[filters]]
component = "impulse"

[[filters]]
component = "pullback"

[[filters]]
component = "wick_body_ratio"

[[filters]]
component = "volatility"

[[filters]]
component = "spread"

