[project]
name = "botscalping"
version = "0.1.0"
description = "Laboratorio de backtest por componentes para scalping en XAUUSD y NAS100"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
ml = ["scikit-learn>=1.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["botscalping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
